try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&saved.rows.length===rows.length&&saved.rows.every((row,index)=>row.image_sha256===rows[index].image_sha256)){rows=saved.rows;document.getElementById('reviewer').value=saved.reviewer||'';}}catch(error){}
const byId=identifier=>document.getElementById(identifier);
allowedTypes.forEach(type=>{const label=document.createElement('label');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=type;checkbox.name='type';label.append(checkbox,document.createTextNode(type));byId('types').append(label);});
function save(){const row=rows[current];row.severity=byId('severity').value;row.hallucination_types=Array.from(document.querySelectorAll('[name=type]:checked')).map(element=>element.value).join(';');row.note=byId('note').value;row.reviewer_id=byId('reviewer').value.trim();row.reviewer_type=row.reviewer_id?'human':'';const valid=row.severity!==''&&row.reviewer_id&&(row.severity==='0'||row.hallucination_types);row.annotation_status=valid?'reviewed':'pending';row.reviewed_at=valid?new Date().toISOString().slice(0,10):'';localStorage.setItem(storageKey,JSON.stringify({rows,reviewer:row.reviewer_id}));byId('status').textContent='已审核 '+rows.filter(item=>item.annotation_status==='reviewed').length+'/'+rows.length;}
function show(){const row=rows[current];byId('position').textContent=`${current+1} / ${rows.length} — ${row.sample_id}`;byId('sample').src=row.image_path;byId('severity').value=row.severity;byId('note').value=row.note;document.querySelectorAll('[name=type]').forEach(element=>element.checked=row.hallucination_types.split(';').includes(element.value));byId('status').textContent=row.annotation_status;}

document.querySelectorAll('input,select,textarea').forEach(element=>element.addEventListener('change',save));
byId('export').onclick=()=>{save();const keys=Object.keys(initialRows[0]);const escape=value=>'"'+String(value??'').replaceAll('"','""')+'"';const csv=[keys.map(escape).join(','),...rows.map(row=>keys.map(key=>escape(row[key])).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='human_reviews.csv';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};show();
